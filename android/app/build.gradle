plugins {
    id 'com.android.application' version '9.5.1'
}

android {
    namespace 'ai.ruqenai.mobile'
    compileSdk 37

    defaultConfig {
        applicationId 'ai.ruqenai.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
